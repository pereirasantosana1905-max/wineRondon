

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Apresentação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho estilo Claude -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">⚽</span>
      <span class="logo-text">Wime</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="recursos.html">Recursos</a>
      <a href="precos.html">Preços</a> <!-- Padronizado para precos.html -->
    </nav>
    <div class="nav-actions">
      <button class="btn-outline" id="btn-contato">Contato</button>
      <button class="btn-primary" id="btn-experimente">Experimente</button>
    </div>
  </header>

  <!-- Conteúdo Principal Divider -->
  <main class="main-container">
    
    <!-- Lado Esquerdo: Login -->
    <section class="login-section">
      <div class="headline">
        <h1>Crie rápido,<br>evolua mais rápido</h1>
        <p>Acesse sua conta para explorar todos os recursos</p>
      </div>

      <div class="card-login">
        <form class="form">
          <div class="input-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="nome@exemplo.com" required>
          </div>

          <div class="input-field">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-submit">Continuar com e-mail</button>
        </form>

        <div class="signup-prompt">
          <span>Ainda não tem conta?</span>
          <a href="cadastro.html" target="_blank">Cadastre-se do zero</a>
        </div>
      </div>
    </section>

    <!-- Lado Direito: Mostruário / Propaganda -->
    <section class="showcase-section">
      <div class="showcase-card">
        <div class="badge">Novo recurso</div>
        <h2>Sua aplicação em outro nível</h2>
        <p>Acompanhe o progresso do seu projeto em tempo real com uma interface fluida e intuitiva.</p>
        
        <div class="mockup-box">
          <div class="mockup-header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="mockup-content">
            <div class="skeleton-line full"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-pill"></div>
          </div>
        </div>
      </div>
    </section>

  </main>
  <script src="script.js" defer></script>
</body>
</html>
