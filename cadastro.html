<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Wime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">⚽</span>
      <span class="logo-text">Wime</span>
    </div>
    <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="recursos.html">Recursos</a>
        <a href="precos.html">Preços</a> <!-- Padronizado para precos.html -->
      </nav>
      <div class="nav-actions">
        <button class="btn-outline" id="btn-contato">Contato</button>
        <button class="btn-primary" id="btn-experimente">Experimente</button>
      </div>
  </header>

  <main class="main-container">
    
    <section class="login-section">
      <div class="headline">
        <h1>Crie sua conta no Wime</h1>
        <p>Preencha os dados abaixo para começar a usar</p>
      </div>

      <div class="card-login">
        <form class="form" id="signup-form">
          <div class="input-field">
            <label for="name">Nome completo</label>
            <input type="text" id="name" placeholder="Seu nome" required>
          </div>

          <div class="input-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="nome@exemplo.com" required>
          </div>

          <div class="input-field">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <div class="input-field">
            <label for="confirm-password">Confirmar Senha</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-submit">Criar conta</button>
        </form>

        <div class="signup-prompt">
          <span>Já tem uma conta?</span>
          <a href="login.html">Fazer login</a>
        </div>
      </div>
    </section>

    <section class="showcase-section">
      <div class="showcase-card">
        <div class="badge">Boas-vindas</div>
        <h2>Junte-se à nossa plataforma</h2>
        <p>Gerencie seus projetos com eficiência e facilidade a partir do seu painel interativo.</p>
        
        <div class="mockup-box">
          <div class="mockup-header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="mockup-content">
            <div class="skeleton-line full"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-pill"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js" defer></script>
  <script src="cadastro.js" defer></script>
</body>
</html>
